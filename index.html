<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Transcriber</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header-title p {
            opacity: 0.9;
            font-size: 16px;
        }

        .header-user {
            text-align: right;
        }

        .username-display {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .logout-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 1px solid #e0e0e0;
        }

        .tab-button {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab-button:hover {
            background: #f9f9f9;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: white;
        }

        .content {
            padding: 40px 30px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="url"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
        }

        input[type="text"]::placeholder,
        input[type="url"]::placeholder {
            color: #999;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
            flex: initial;
            padding: 8px 16px;
            font-size: 14px;
        }

        .btn-delete:hover {
            background: #ee5a52;
        }

        .status {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
            border-left: 4px solid #388e3c;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }

        .status-text {
            margin-bottom: 10px;
            font-weight: 500;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: currentColor;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .transcript-container {
            margin-top: 30px;
            display: none;
        }

        .transcript-container.show {
            display: block;
        }

        .transcript-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .transcript-header h2 {
            font-size: 20px;
            color: #333;
        }

        .copy-btn {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .copy-btn:hover {
            background: #764ba2;
        }

        .copy-btn.copied {
            background: #4caf50;
        }

        .transcript-text {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            line-height: 1.8;
            color: #333;
            font-size: 16px;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .url-info {
            margin-top: 15px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 6px;
            font-size: 14px;
            color: #666;
            word-break: break-all;
        }

        /* History styles */
        .history-list {
            display: grid;
            gap: 15px;
        }

        .history-item {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .history-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .history-item-title {
            font-weight: 600;
            color: #333;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .history-item-date {
            font-size: 13px;
            color: #999;
            margin-bottom: 8px;
        }

        .history-item-url {
            font-size: 13px;
            color: #666;
            word-break: break-all;
            margin-bottom: 10px;
        }

        .history-item-actions {
            display: flex;
            gap: 10px;
        }

        .btn-view {
            flex: 1;
            padding: 8px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .btn-view:hover {
            background: #764ba2;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .empty-state-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #666;
        }

        .detail-view {
            display: none;
        }

        .detail-view.show {
            display: block;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .detail-header h2 {
            color: #333;
            font-size: 24px;
        }

        .back-btn {
            padding: 10px 20px;
            background: #f0f0f0;
            color: #333;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .back-btn:hover {
            background: #e0e0e0;
        }

        .detail-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .meta-item {
            font-size: 14px;
        }

        .meta-label {
            color: #999;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .meta-value {
            color: #333;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="header-title">
                    <h1>🎥 YouTube Transcriber</h1>
                    <p>Transcribe videos, save transcripts, view history</p>
                </div>
                <div class="header-user">
                    <div class="username-display">Hello, <span id="username-display">User</span></div>
                    <a href="/logout" class="logout-btn">Logout</a>
                </div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-button active" data-tab="transcribe">New Transcription</button>
            <button class="tab-button" data-tab="history">History</button>
        </div>

        <div class="content">
            <!-- Transcribe Tab -->
            <div class="tab-content active" id="transcribe-tab">
                <div class="form-group">
                    <label for="transcription-name">Video Name</label>
                    <input
                        type="text"
                        id="transcription-name"
                        placeholder="e.g., Trading Strategy 101"
                        autocomplete="off"
                    >
                </div>

                <div class="form-group">
                    <label for="youtube-url">YouTube URL</label>
                    <input
                        type="url"
                        id="youtube-url"
                        placeholder="https://www.youtube.com/watch?v=..."
                        autocomplete="off"
                    >
                </div>

                <div class="button-group">
                    <button class="btn-primary" id="transcribe-btn">Transcribe</button>
                    <button class="btn-secondary" id="clear-btn">Clear</button>
                </div>

                <div class="status" id="status"></div>

                <div class="transcript-container" id="transcript-container">
                    <div class="transcript-header">
                        <h2>Transcript</h2>
                        <button class="copy-btn" id="copy-btn">Copy to Clipboard</button>
                    </div>
                    <div class="transcript-text" id="transcript-text"></div>
                    <div class="url-info" id="url-info"></div>
                </div>
            </div>

            <!-- History Tab -->
            <div class="tab-content" id="history-tab">
                <div id="history-list-view">
                    <div class="history-list" id="history-list"></div>
                    <div class="empty-state" id="empty-state" style="display: none;">
                        <div class="empty-state-icon">📭</div>
                        <div class="empty-state-title">No transcriptions yet</div>
                        <p>Start by creating your first transcription</p>
                    </div>
                </div>

                <div class="detail-view" id="detail-view">
                    <div class="detail-header">
                        <h2 id="detail-title"></h2>
                        <button class="back-btn" id="back-btn">← Back</button>
                    </div>
                    <div class="detail-meta">
                        <div class="meta-item">
                            <div class="meta-label">Date Created</div>
                            <div class="meta-value" id="detail-date"></div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">YouTube URL</div>
                            <div class="meta-value" id="detail-url"></div>
                        </div>
                    </div>
                    <div class="transcript-header">
                        <h3>Transcript</h3>
                        <button class="copy-btn" id="detail-copy-btn">Copy to Clipboard</button>
                    </div>
                    <div class="transcript-text" id="detail-transcript"></div>
                    <div style="margin-top: 20px;">
                        <button class="btn-delete" id="delete-btn" style="width: 100%;">🗑️ Delete This Transcription</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        // Load username on page load
        async function loadUsername() {
            try {
                const response = await fetch('/api/user', {
                    credentials: 'include'
                });
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('username-display').textContent = data.username;
                } else if (response.status === 401) {
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Error loading username:', error);
            }
        }

        loadUsername();

        // DOM Elements
        const transcribeTab = document.getElementById('transcribe-tab');
        const historyTab = document.getElementById('history-tab');
        const tabButtons = document.querySelectorAll('.tab-button');

        const nameInput = document.getElementById('transcription-name');
        const urlInput = document.getElementById('youtube-url');
        const transcribeBtn = document.getElementById('transcribe-btn');
        const clearBtn = document.getElementById('clear-btn');
        const statusDiv = document.getElementById('status');
        const transcriptContainer = document.getElementById('transcript-container');
        const transcriptText = document.getElementById('transcript-text');
        const urlInfo = document.getElementById('url-info');
        const copyBtn = document.getElementById('copy-btn');

        const historyListView = document.getElementById('history-list-view');
        const historyList = document.getElementById('history-list');
        const emptyState = document.getElementById('empty-state');
        const detailView = document.getElementById('detail-view');
        const backBtn = document.getElementById('back-btn');
        const detailTitle = document.getElementById('detail-title');
        const detailDate = document.getElementById('detail-date');
        const detailUrl = document.getElementById('detail-url');
        const detailTranscript = document.getElementById('detail-transcript');
        const detailCopyBtn = document.getElementById('detail-copy-btn');
        const deleteBtn = document.getElementById('delete-btn');

        let currentDetailId = null;

        // Tab switching
        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                tabButtons.forEach(b => b.classList.remove('active'));
                button.classList.add('active');

                const tabName = button.getAttribute('data-tab');
                transcribeTab.classList.remove('active');
                historyTab.classList.remove('active');

                if (tabName === 'transcribe') {
                    transcribeTab.classList.add('active');
                } else {
                    historyTab.classList.add('active');
                    loadHistory();
                }
            });
        });

        function showStatus(message, type = 'loading') {
            statusDiv.className = `status show ${type}`;
            statusDiv.innerHTML = `<div class="status-text">
                ${type === 'loading' ? '<span class="spinner"></span>' : ''}
                ${message}
            </div>`;
        }

        function hideStatus() {
            statusDiv.classList.remove('show');
        }

        function hideTranscript() {
            transcriptContainer.classList.remove('show');
        }

        async function transcribe() {
            const url = urlInput.value.trim();
            const name = nameInput.value.trim();

            if (!url) {
                showStatus('Please enter a YouTube URL', 'error');
                return;
            }

            if (!name) {
                showStatus('Please enter a video name', 'error');
                return;
            }

            if (!url.includes('youtube.com') && !url.includes('youtu.be')) {
                showStatus('Please enter a valid YouTube URL', 'error');
                return;
            }

            transcribeBtn.disabled = true;
            showStatus('Downloading and transcribing... This may take a minute or two.');
            hideTranscript();

            try {
                const response = await fetch(`${API_BASE}/transcribe`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url, name })
                });

                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const data = await response.json();

                if (!response.ok || !data.success) {
                    showStatus(`Error: ${data.error || 'Unknown error'}`, 'error');
                    return;
                }

                transcriptText.textContent = data.transcript;
                urlInfo.textContent = `Video URL: ${data.url}`;
                transcriptContainer.classList.add('show');
                showStatus(`✓ Transcription saved! (ID: ${data.id})`, 'success');

            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            } finally {
                transcribeBtn.disabled = false;
            }
        }

        function clearAll() {
            nameInput.value = '';
            urlInput.value = '';
            transcriptText.textContent = '';
            urlInfo.textContent = '';
            hideTranscript();
            hideStatus();
            nameInput.focus();
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(transcriptText.textContent).then(() => {
                copyBtn.textContent = '✓ Copied!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = 'Copy to Clipboard';
                    copyBtn.classList.remove('copied');
                }, 2000);
            });
        }

        async function loadHistory() {
            try {
                const response = await fetch(`${API_BASE}/transcriptions`, {
                    credentials: 'include'
                });

                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const data = await response.json();

                if (!response.ok) {
                    emptyState.style.display = 'block';
                    historyList.innerHTML = '';
                    return;
                }

                const transcriptions = data.transcriptions || [];

                if (transcriptions.length === 0) {
                    emptyState.style.display = 'block';
                    historyList.innerHTML = '';
                } else {
                    emptyState.style.display = 'none';
                    historyList.innerHTML = transcriptions.map(item => `
                        <div class="history-item" onclick="viewTranscription(${item.id})">
                            <div class="history-item-title">${escapeHtml(item.name)}</div>
                            <div class="history-item-date">${new Date(item.created_at).toLocaleString()}</div>
                            <div class="history-item-url">${escapeHtml(item.youtube_url)}</div>
                            <div class="history-item-actions">
                                <button class="btn-view" onclick="viewTranscription(${item.id}); event.stopPropagation();">View</button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                historyList.innerHTML = `<div style="color: red;">Error loading history: ${error.message}</div>`;
            }
        }

        async function viewTranscription(id) {
            try {
                const response = await fetch(`${API_BASE}/transcriptions/${id}`, {
                    credentials: 'include'
                });

                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const data = await response.json();

                if (!response.ok) {
                    alert('Error loading transcription');
                    return;
                }

                currentDetailId = id;
                detailTitle.textContent = data.name;
                detailDate.textContent = new Date(data.created_at).toLocaleString();
                detailUrl.textContent = data.youtube_url;
                detailTranscript.textContent = data.transcript;

                historyListView.style.display = 'none';
                detailView.classList.add('show');
            } catch (error) {
                alert('Error loading transcription: ' + error.message);
            }
        }

        function goBack() {
            historyListView.style.display = 'block';
            detailView.classList.remove('show');
            currentDetailId = null;
        }

        async function deleteTranscription() {
            if (!confirm('Are you sure you want to delete this transcription?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/transcriptions/${currentDetailId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                if (!response.ok) {
                    alert('Error deleting transcription');
                    return;
                }

                alert('Transcription deleted');
                goBack();
                loadHistory();
            } catch (error) {
                alert('Error deleting transcription: ' + error.message);
            }
        }

        function detailCopy() {
            navigator.clipboard.writeText(detailTranscript.textContent).then(() => {
                detailCopyBtn.textContent = '✓ Copied!';
                detailCopyBtn.classList.add('copied');
                setTimeout(() => {
                    detailCopyBtn.textContent = 'Copy to Clipboard';
                    detailCopyBtn.classList.remove('copied');
                }, 2000);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        transcribeBtn.addEventListener('click', transcribe);
        clearBtn.addEventListener('click', clearAll);
        copyBtn.addEventListener('click', copyToClipboard);
        backBtn.addEventListener('click', goBack);
        deleteBtn.addEventListener('click', deleteTranscription);
        detailCopyBtn.addEventListener('click', detailCopy);

        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') transcribe();
        });

        nameInput.focus();
    </script>
</body>
</html>
